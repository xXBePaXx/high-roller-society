name: Deploy High Roller Society

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hrs/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci
        working-directory: hrs

      - name: Umgebungsvariablen schreiben
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
        working-directory: hrs

      - name: Seite bauen
        run: npm run build
        working-directory: hrs

      - name: 404.html erstellen
        run: cp dist/index.html dist/404.html
        working-directory: hrs

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v4

      - name: Build hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: hrs/dist

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
